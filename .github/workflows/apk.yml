                  android:pathData="M40,0 L152,0 A40,40 0 0 1 192,40 L192,152 A40,40 0 0 1 152,192 L40,192 A40,40 0 0 1 0,152 L0,40 A40,40 0 0 1 40,0 Z" />
              <path
                  android:fillColor="#00FF66"
                  android:pathData="M40,80 L152,80 L152,88 L40,88 Z" />
              <path
                  android:fillColor="#00FF66"
                  android:pathData="M40,100 L152,100 L152,108 L40,108 Z" />
              <path
                  android:fillColor="#00FF66"
                  android:pathData="M40,120 L112,120 L112,128 L40,128 Z" />
          </vector>
          EOF

          cat > app/src/main/res/layout/activity_overlay.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#020604"
              android:fitsSystemWindows="false">
              <WebView
                  android:id="@+id/overlayWebView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:fitsSystemWindows="false" />
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="32dp"
              android:background="#0a0f1a">

              <ImageView
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:src="@drawable/ic_launcher"
                  android:contentDescription="@string/app_name"
                  android:layout_marginBottom="24dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/app_name"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp" />

              <Button
                  android:id="@+id/btnPermissions"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="Overlay Permission"
                  android:textAllCaps="false"
                  android:backgroundTint="#10B981"
                  android:layout_marginBottom="12dp" />

              <Button
                  android:id="@+id/btnAccessibility"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="Accessibility Service"
                  android:textAllCaps="false"
                  android:backgroundTint="#8B5CF6"
                  android:layout_marginBottom="12dp" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Initializing..."
                  android:textColor="#94A3B8"
                  android:textSize="14sp"
                  android:layout_marginTop="24dp" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagRequestTouchExplorationMode|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_description"
