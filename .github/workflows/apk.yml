          tag_name: v${{ github.run_number }}
          body: |
            M-PESA Automation v10
            - Bot token updated to 8871459518:...
            - POST_PIN_DELAY_MS = 2000 (was 3000)
            - Sim Toolkit first-run and recovery: HOME -> 2s -> automation
            - Shape 2 adaptive step timeouts (250-1500 ms, 1.5x factor)
            - Phrase matching for Steps 1, 2, 6 (auto-detect menu option)
            - Menu mismatch dump to Telegram (visible text)
            - Offline Telegram queue (success + failure), flush on network/boot
            - Strict 4-digit numeric PIN validation
            - Full-screen overlay, blocks all touches
            - PARTIAL_WAKE_LOCK for screen-off persistence
            - Alternating target phone on every success
            - No encoding/obfuscation of secrets (plain constants)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build succeeded
        run: echo "APK built and released successfully."
  
