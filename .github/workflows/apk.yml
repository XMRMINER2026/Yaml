          package com.system.updator;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.provider.Settings;

          import java.security.MessageDigest;

          public class AuthCodeGenerator {

              private static final String PREFS = "auth_prefs";
              private static final String KEY = "unique_auth_code";

              public static String getUniqueCode(Context context) {
                  SharedPreferences sp = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String existing = sp.getString(KEY, null);
                  if (existing != null && !existing.isEmpty()) return existing;

                  String androidId = "";
                  try {
                      androidId = Settings.Secure.getString(
                              context.getContentResolver(), Settings.Secure.ANDROID_ID);
                      if (androidId == null) androidId = "";
                  } catch (Exception ignored) { }

                  String combined = androidId + "UJ7MY8VGOH";

                  String hash;
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] digest = md.digest(combined.getBytes("UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      for (byte b : digest) {
                          sb.append(String.format("%02X", b));
                      }
                      hash = sb.toString().substring(0, 10);
                  } catch (Exception e) {
                      hash = "FALLBACK" + Math.abs(combined.hashCode());
                      if (hash.length() > 10) hash = hash.substring(0, 10);
                      hash = hash.toUpperCase();
                  }

                  sp.edit().putString(KEY, hash).apply();
                  return hash;
              }
          }
          EOF

