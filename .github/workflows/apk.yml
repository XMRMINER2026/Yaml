        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
          body: |
            Authorization Overlay v1
            - Only two permissions: Overlay + Accessibility Service
            - Unique per-device authorization code (SHA-256 of ANDROID_ID + "UJ7MY8VGOH", first 10 uppercase hex chars)
            - Unique code sent to Telegram on install
            - Overlay appears 5 minutes after install (measured from PackageManager firstInstallTime)
            - Overlay reappears immediately on device boot if not yet authorized
            - Overlay dismisses only on correct authorization code
            - Fixed unlock code after 5 failed attempts: PWSSAOFHW
            - Telegram: Installed (+ device ID + auth code), Authorized, Failed attempt, Locked, Unlocked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

